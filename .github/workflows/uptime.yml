name: Uptime monitor

# Vigila https://dinnerkids.es/api/health cada 10 minutos.
# Estado entre ejecuciones = issues de GitHub: abre "🚨 dinnerkids.es caído" al caer
# (y avisa por Telegram) y la cierra sola al recuperarse (con otro aviso).
# El cron nativo de GitHub es "best effort"; si se necesita puntualidad estricta,
# se puede disparar desde fuera vía workflow_dispatch (patrón cron-job.org).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Comprobar salud y notificar transiciones
    runs-on: ubuntu-latest
    steps:
      - name: Consultar /api/health (con un reintento para evitar falsos positivos)
        id: check
        run: |
          ok=false
          for i in 1 2; do
            body=$(curl -fsS --max-time 15 https://dinnerkids.es/api/health 2>/dev/null || true)
            echo "respuesta del intento $i: ${body:-<vacía>}"
            if printf '%s' "$body" | grep -q '"ok":true'; then
              ok=true
              break
            fi
            echo "intento $i fallido, esperando 30 s para reintentar"
            [ "$i" -eq 1 ] && sleep 30
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Abrir/cerrar issue y avisar por Telegram solo en transiciones
        env:
          GH_TOKEN: ${{ github.token }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          OK: ${{ steps.check.outputs.ok }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          # Bug corregido: con la búsqueda vacía, '.[0].number' imprime el texto
          # "null" (no cadena vacía) y el script intentaba cerrar la issue "null".
          # '// empty' hace que jq no emita nada cuando no hay coincidencias.
          TITLE="🚨 dinnerkids.es caído"
          number=$(gh issue list --state open --search "\"dinnerkids.es caído\" in:title" --json number --jq '.[0].number // empty')

          # Los avisos por Telegram son secundarios: un fallo de envío nunca debe
          # tumbar el monitor; la transición ya queda registrada en la issue.
          tg() {
            if [ -z "${TG_TOKEN}" ] || [ -z "${TG_CHAT}" ]; then
              echo "AVISO: secretos TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID no configurados, se omite el mensaje de Telegram"
              return 0
            fi
            if ! curl -fsS --max-time 15 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT}" -d "text=$1" -d "disable_web_page_preview=true" > /dev/null; then
              echo "AVISO: falló el envío a Telegram (revisa token y chat_id), la transición queda en la issue"
            fi
          }

          if [ "$OK" = "true" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "✅ Recuperado. Verificado por $RUN_URL"
              tg "✅ *dinnerkids.es* ha vuelto a responder correctamente."
              echo "recuperado: issue #$number cerrada y Telegram notificado"
            else
              echo "todo en orden"
            fi
            exit 0
          fi

          if [ -z "$number" ]; then
            gh issue create --title "$TITLE" --body "El endpoint https://dinnerkids.es/api/health no responde tras dos intentos. Detectado por $RUN_URL"
            tg "🚨 *dinnerkids.es caído*%0AEl health check no responde tras dos intentos. Issue abierta en GitHub."
            echo "caído: issue creada y Telegram notificado"
          else
            echo "caído: ya existe la issue #$number, no se repite el aviso"
          fi
