name: Tests y Sintaxis

on:
  push:
    branches: [edge-pwa, main, lab]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Comprobar sintaxis JavaScript
        run: npm run check
      - name: Ejecutar batería de tests
        run: npm test
