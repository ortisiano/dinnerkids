name: Deploy to GitHub Pages (Release)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    name: Verificar integridad antes de desplegar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Comprobar sintaxis JS (npm run check)
        run: npm run check

      - name: Ejecutar batería de tests (npm test)
        run: npm test

  deploy:
    name: Desplegar en GitHub Pages
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Preparar artefactos estáticos de la PWA
        run: |
          mkdir -p _site
          cp index.html privacidad.html logic.js sw.js manifest.webmanifest recetas.json _headers _site/
          cp -r assets _site/
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto a Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

