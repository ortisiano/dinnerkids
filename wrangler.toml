name = "dinnerkids"
main = "worker.js"
compatibility_date = "2026-11-01"

# Servir la web estática (PWA, index.html, recetas.json, sw.js) directamente desde el CDN de Cloudflare
[assets]
directory = "."

# Memoria KV del Worker (rate limit, vinculación de dispositivos, cuotas y caché).
# Declararla aquí garantiza que NINGÚN despliegue futuro la pierda (pentest 2026-11-12:
# la binding solo existía en el panel y el Worker quedó sin rate limit ni anti-abuso).
# Los SECRETOS (ANTHROPIC_API_KEY, PRO_CODE_SECRET) siguen exclusivamente en
# Variables and Secrets del panel de Cloudflare — NUNCA en este archivo.
[[kv_namespaces]]
binding = "DK_KV"
id = "f7df8b5580d6489894db3014e0a96278"
