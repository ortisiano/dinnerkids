name = "dinnerkids-api"
main = "worker.js"
compatibility_date = "2026-11-01"

# Espacio de claves gratuito en Cloudflare KV (sustituye a Qdrant + guarda cuotas mensuales)
# Al crear el KV en Cloudflare (Workers & Pages -> KV -> Create namespace "DK_KV"),
# pega aquí debajo el id que te dé Cloudflare:
# [[kv_namespaces]]
# binding = "DK_KV"
# id = "PEGA_AQUI_EL_ID_DE_TU_KV"

# Secretos que se configuran en el panel de Cloudflare (Workers -> Settings -> Variables and Secrets):
# - ANTHROPIC_API_KEY : Tu clave de Claude Haiku (sk-ant-...)
# - PRO_CODE_SECRET   : Una frase secreta larga tuya para firmar los códigos Pro (ej: DK10-...)
